<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翼眸 - 民航舆情分析</title>

    <!-- 保留原有CDN（必须保留） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <!-- Tailwind CSS（全新样式） -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 保留关键CSS变量 -->
    <style>
        :root {
            --console-offset: 52px;
        }
        .page-actions {
            position: fixed;
            top: 16px;
            right: 18px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
    </style>

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">
    <!-- 导航栏（保持不变） -->
    <nav class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-lg">🛫</span>
                    </div>
                    <a href="{{ url_for('index') }}" class="text-xl font-bold text-gray-800 hover:text-blue-600 transition">
                        翼眸
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="{{ url_for('index') }}" class="text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition">首页</a>
                    <span class="text-gray-300">|</span>
                    <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
                        LLM已配置
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 页面标题（保持不变） -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center">
                <span class="bg-blue-600 w-1.5 h-8 rounded-full mr-3"></span>
                翼眸 · 民航舆情分析
            </h1>
            <p class="text-gray-500 mt-2 ml-4">输入关键词或上传视频，实时监测民航相关舆情动态</p>
        </div>

        <!-- 核心搜索区（保持不变） -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1 relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" id="query-input" class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                           placeholder="例如：航班延误、充电宝、航空安全...">
                </div>
                <button id="search-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-medium transition shadow-sm hover:shadow flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    搜索
                </button>
            </div>

            <!-- 上传模板区域（保持不变） -->
            <div class="mt-4 border-2 border-dashed border-gray-200 rounded-xl p-6 text-center hover:border-blue-300 hover:bg-blue-50/30 transition cursor-pointer" id="upload-area">
                <div class="flex flex-col items-center">
                    <svg class="w-10 h-10 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-gray-600">拖拽模板至此上传，或 <span class="text-blue-600 font-medium">浏览文件</span></p>
                    <p class="text-xs text-gray-400 mt-1">支持 .md .txt 格式</p>
                </div>
                <input type="file" id="file-input" class="hidden" accept=".md,.txt">
            </div>
        </div>

        <!-- Agent 卡片网格（保持不变） -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <!-- ... 保持原样 ... -->
        </div>

        <!-- 报告生成进度区（关键修改点1：添加进度区域） -->
        <div class="bg-white rounded-xl border border-gray-100 p-6 mb-8">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold text-gray-800 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    当前任务：<span id="current-task">民航舆情分析</span>
                </h3>
                <span class="text-sm text-gray-500 font-mono" id="timer">00:00:00</span>
            </div>

            <!-- 进度条（保持不变） -->
            <div class="relative pt-1">
                <div class="flex mb-2 items-center justify-between">
                    <div>
                        <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-blue-600 bg-blue-200" id="progress-status">
                            准备中...
                        </span>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-semibold inline-block text-blue-600" id="progress-percent">0%</span>
                    </div>
                </div>
                <div class="overflow-hidden h-2 mb-4 text-xs flex rounded bg-blue-200">
                    <div style="width:0%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-blue-600 transition-all duration-500" id="progress-bar"></div>
                </div>
            </div>
            
            <!-- 新增：报告内容展示区域（关键修改点2） -->
            <div id="report-content" class="mt-6"></div>
        </div>

        <!-- 关闭系统按钮（保持不变） -->
        <div class="text-right">
            <button id="shutdown-btn" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-sm transition">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4M12 4v16"></path>
                </svg>
                关闭系统
            </button>
        </div>
    </main>

    <!-- 底部信息（保持不变） -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-400">
            © 2026 翼眸 · 民航舆情分析系统 · 基于多智能体协作 · 用 ❤️ 为大创项目打造
        </div>
    </footer>

    <!-- 原有浮动按钮（保持不变） -->
    <div class="page-actions">
        <button onclick="exportPDF()" class="bg-blue-500 text-white px-3 py-1 rounded text-sm">导出PDF</button>
        <button onclick="exportVis()" class="bg-green-500 text-white px-3 py-1 rounded text-sm">导出图谱</button>
    </div>

    <!-- ========== 重要：修改后的JavaScript（关键！） ========== -->
    <script>
        // =============== 新增功能：WebSocket 通信核心 ===============
        const socket = io(); // 连接后端WebSocket

        // =============== 功能1：进度实时更新（关键！） ===============
        socket.on('progress_update', (data) => {
            // 更新进度条
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const progressStatus = document.getElementById('progress-status');
            
            if (progressBar) progressBar.style.width = `${data.progress}%`;
            if (progressPercent) progressPercent.textContent = `${data.progress}%`;
            if (progressStatus) {
                // 根据进度更新状态文本
                if (data.progress < 30) progressStatus.textContent = "数据爬取中...";
                else if (data.progress < 70) progressStatus.textContent = "多模态分析中...";
                else progressStatus.textContent = "报告生成中...";
            }
            
            // 更新计时器
            updateTimer();
        });

        // =============== 功能2：报告生成完成（关键！） ===============
        socket.on('report_ready', (report) => {
            // 更新任务标题
            document.getElementById('current-task').textContent = report.title;
            
            // 清空报告区域
            const reportContent = document.getElementById('report-content');
            reportContent.innerHTML = '';
            
            // 生成报告内容
            const reportHTML = `
                <div class="bg-white rounded-lg shadow-sm p-5">
                    <h3 class="text-xl font-bold text-gray-800 mb-3">📊 ${report.title}</h3>
                    
                    <div class="mb-4">
                        <h4 class="font-semibold text-gray-700 mb-2">🔍 分析摘要</h4>
                        <p class="text-gray-600">${report.content}</p>
                    </div>
                    
                    <div class="mb-4">
                        <h4 class="font-semibold text-gray-700 mb-2">💬 情感分析</h4>
                        <span class="inline-block px-3 py-1 rounded-full text-sm 
                            ${report.sentiment === 'positive' ? 'bg-green-100 text-green-700' : 
                              report.sentiment === 'negative' ? 'bg-red-100 text-red-700' : 
                              'bg-yellow-100 text-yellow-700'}">
                            ${report.sentiment === 'positive' ? '正面' : 
                              report.sentiment === 'negative' ? '负面' : '中性'}
                        </span>
                    </div>
                    
                    <div>
                        <h4 class="font-semibold text-gray-700 mb-2">🔥 热点话题</h4>
                        <div class="flex flex-wrap gap-2">
                            ${report.hot_topics.map(topic => 
                                `<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm">
                                    #${topic}
                                </span>`
                            ).join('')}
                        </div>
                    </div>
                </div>
            `;
            
            reportContent.innerHTML = reportHTML;
            
            // 显示导出按钮
            document.querySelector('.page-actions').style.display = 'flex';
            
            // 重置进度条
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-percent').textContent = '0%';
            
            // 显示成功提示
            alert(`报告生成完成！点击右上角导出PDF查看详细内容`);
        });

        // =============== 功能3：错误处理（关键！） ===============
        socket.on('error', (error) => {
            alert(`生成失败: ${error.message}`);
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-percent').textContent = '0%';
        });

        // =============== 功能4：计时器（增强体验） ===============
        let startTime = 0;
        function updateTimer() {
            if (startTime === 0) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            document.getElementById('timer').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // =============== 功能5：搜索按钮交互（关键！） ===============
        document.addEventListener('DOMContentLoaded', function() {
            const searchBtn = document.getElementById('search-btn');
            const searchInput = document.getElementById('query-input');
            
            if (searchBtn && searchInput) {
                searchBtn.addEventListener('click', function() {
                    const query = searchInput.value.trim();
                    if (!query) {
                        alert('请输入关键词（如：航班延误、充电宝安全）');
                        return;
                    }
                    
                    // 重置状态
                    document.getElementById('progress-bar').style.width = '0%';
                    document.getElementById('progress-percent').textContent = '0%';
                    document.getElementById('progress-status').textContent = '准备中...';
                    document.getElementById('timer').textContent = '00:00:00';
                    document.getElementById('report-content').innerHTML = '';
                    document.querySelector('.page-actions').style.display = 'none';
                    
                    // 开始计时
                    startTime = Date.now();
                    setInterval(updateTimer, 1000);
                    
                    // 发送请求到后端
                    socket.emit('start_report_generation', { query });
                    
                    // 更新任务标题
                    document.getElementById('current-task').textContent = `正在分析：${query}`;
                    
                    // 显示进度区域
                    document.querySelector('#report-generation').style.display = 'block';
                    
                    // 按钮状态
                    this.textContent = '生成中...';
                    this.disabled = true;
                });
                
                // 回车键触发
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') searchBtn.click();
                });
            }

            // =============== 功能6：关闭系统（保持不变） ===============
            const shutdownBtn = document.getElementById('shutdown-btn');
            if (shutdownBtn) {
                shutdownBtn.addEventListener('click', function() {
                    if (confirm('确定要关闭系统吗？')) {
                        fetch('/shutdown', { method: 'POST' })
                            .then(() => alert('系统已关闭'))
                            .catch(err => alert('关闭失败'));
                    }
                });
            }
        });

        // =============== 功能7：PDF导出（保留原有功能） ===============
        function exportPDF() {
            const element = document.getElementById('report-content');
            if (!element) {
                alert('请先生成报告');
                return;
            }
            
            // 使用html2canvas和jspdf生成PDF
            html2canvas(element).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jspdf.jsPDF();
                const imgWidth = 210; // A4宽度
                const pageHeight = 297;
                const imgHeight = canvas.height * imgWidth / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
                pdf.save('民航舆情分析报告.pdf');
            });
        }
    </script>

    <!-- 自定义交互 JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
