<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翼眸 - 民航舆情分析</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --console-offset: 52px; }
        .page-actions { position: fixed; top: 16px; right: 18px; display: flex; gap: 10px; z-index: 100; }
        .video-upload { border: 2px dashed #3b82f6; border-radius: 12px; padding: 2rem; text-align: center; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">
    <nav class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center"><span class="text-white font-bold text-lg">🛫</span></div>
                    <a href="#" class="text-xl font-bold text-gray-800 hover:text-blue-600 transition">翼眸</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="#" class="text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition">首页</a>
                    <span class="text-gray-300">|</span>
                    <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">LLM已配置</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center">
                <span class="bg-blue-600 w-1.5 h-8 rounded-full mr-3"></span>
                翼眸 · 民航舆情分析
            </h1>
            <p class="text-gray-500 mt-2 ml-4">上传民航短视频，获取专业舆情分析报告</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1 relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" id="query-input" class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="例如：充电宝安全、航班延误...">
                </div>
                <button id="search-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-medium transition shadow-sm hover:shadow flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    搜索
                </button>
            </div>
            
            <div class="video-upload mt-4" id="upload-area">
                <div class="flex flex-col items-center">
                    <svg class="w-10 h-10 text-blue-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 3.536l-.804.804A4 4 0 0117.88 6H18a2 2 0 012 2v1a2 2 0 01-2 2h-.12l-.804.804A4 4 0 0111.88 16H12a2 2 0 012 2v1a2 2 0 01-2 2h-.12l-.804.804A4 4 0 016.12 18H6a2 2 0 01-2-2v-1a2 2 0 012-2h.12L9.536 3.536zM12 12a4 4 0 100-8 4 4 0 000 8z"></path>
                    </svg>
                    <p class="text-gray-600 font-medium">拖拽民航短视频至此上传，或 <span class="text-blue-600 font-semibold">浏览文件</span></p>
                    <p class="text-xs text-gray-400 mt-1">支持 .mp4 .avi .mov 格式（示例：机场安检、航班延误）</p>
                </div>
                <input type="file" id="file-input" class="hidden" accept=".mp4,.avi,.mov">
            </div>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 p-6 mb-8">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold text-gray-800 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    当前任务：<span id="current-task">等待上传视频</span>
                </h3>
                <span class="text-sm text-gray-500 font-mono" id="timer">00:00:00</span>
            </div>
            
            <div class="relative pt-1">
                <div class="flex mb-2 items-center justify-between">
                    <div>
                        <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-blue-600 bg-blue-200" id="progress-status">准备分析</span>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-semibold inline-block text-blue-600" id="progress-percent">0%</span>
                    </div>
                </div>
                <div class="overflow-hidden h-2 mb-4 text-xs flex rounded bg-blue-200">
                    <div style="width:0%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-blue-600 transition-all duration-500" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <div class="text-right" id="report-actions" style="display:none;">
            <button id="export-btn" class="px-4 py-2 bg-blue-500 text-white rounded-lg text-sm transition">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4-4m0 0L8 8m0 0l-4 4m4-4v12"></path>
                </svg>
                导出PDF
            </button>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-400">
            © 2026 翼眸 · 民航舆情分析系统 · 基于多智能体协作 · 用 ❤️ 为大创项目打造
        </div>
    </footer>

    <div class="page-actions" style="display:none;">
        <button id="export-pdf" class="bg-blue-500 text-white px-3 py-1 rounded text-sm">导出PDF</button>
        <button id="export-vis" class="bg-green-500 text-white px-3 py-1 rounded text-sm">导出图谱</button>
    </div>

    <script>
        const socket = io();
        let analysisTimer;

        document.addEventListener('DOMContentLoaded', () => {
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');
            const searchBtn = document.getElementById('search-btn');
            const exportBtn = document.getElementById('export-btn');
            const exportPdfBtn = document.getElementById('export-pdf');

            // 视频上传处理
            uploadArea.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleVideoUpload);

            // 拖放支持
            uploadArea.addEventListener('dragover', e => {
                e.preventDefault();
                uploadArea.style.borderColor = '#3b82f6';
                uploadArea.style.backgroundColor = '#dbeafe';
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#e5e7eb';
                uploadArea.style.backgroundColor = '';
            });
            uploadArea.addEventListener('drop', e => {
                e.preventDefault();
                uploadArea.style.borderColor = '#e5e7eb';
                uploadArea.style.backgroundColor = '';
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleVideoUpload();
                }
            });

            // 视频上传逻辑
            function handleVideoUpload() {
                const file = fileInput.files[0];
                if (!file) return;
                
                // 格式验证
                const validTypes = ['video/mp4', 'video/avi', 'video/mov'];
                if (!validTypes.includes(file.type)) {
                    alert('错误：仅支持MP4/AVI/MOV格式的民航视频');
                    return;
                }
                
                // 更新UI
                document.getElementById('current-task').textContent = `分析中：${file.name}`;
                document.getElementById('progress-status').textContent = '视频上传中...';
                document.getElementById('progress-bar').style.width = '0%';
                document.getElementById('progress-percent').textContent = '0%';
                document.getElementById('report-actions').style.display = 'none';
                
                // 上传到后端
                const formData = new FormData();
                formData.append('video', file);
                
                fetch('/upload_video', { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            socket.emit('start_video_analysis', { 
                                video_id: data.video_id,
                                filename: file.name
                            });
                            startTimer();
                        } else {
                            alert(`上传失败: ${data.message}`);
                        }
                    });
            }

            // 分析进度更新
            socket.on('video_analysis_progress', data => {
                const bar = document.getElementById('progress-bar');
                const percent = document.getElementById('progress-percent');
                const status = document.getElementById('progress-status');
                
                bar.style.width = `${data.progress}%`;
                percent.textContent = `${data.progress}%`;
                
                // 状态更新
                if (data.progress < 30) status.textContent = '视频帧提取中...';
                else if (data.progress < 60) status.textContent = '内容语义分析中...';
                else if (data.progress < 85) status.textContent = '情感分析中...';
                else status.textContent = '报告生成中...';
            });

            // 分析完成
            socket.on('video_analysis_complete', report => {
                clearInterval(analysisTimer);
                document.getElementById('current-task').textContent = `分析完成：${report.title}`;
                document.getElementById('progress-status').textContent = '分析完成';
                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('progress-percent').textContent = '100%';
                
                // 显示报告
                const reportContent = `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                        <div class="flex items-center mb-4">
                            <div class="bg-blue-100 p-2 rounded-full mr-3">
                                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                            <h3 class="text-2xl font-bold text-gray-800">${report.title}</h3>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div class="bg-gray-50 p-4 rounded-lg">
                                <h4 class="font-semibold text-blue-600 mb-2">🔍 视频摘要</h4>
                                <p class="text-gray-600 leading-relaxed">${report.summary}</p>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-lg">
                                <h4 class="font-semibold text-blue-600 mb-2">📊 情感分析</h4>
                                <div class="mt-2">
                                    <div class="flex justify-between mb-1">
                                        <span class="text-gray-600">整体情感</span>
                                        <span class="font-medium">${report.sentiment}</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                                        <div class="bg-${report.sentiment_score > 50 ? 'green' : 'red'}-500 h-2.5 rounded-full" style="width: ${report.sentiment_score}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-6">
                            <h4 class="font-semibold text-blue-600 flex items-center mb-3">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                </svg>
                                热点话题分析
                            </h4>
                            <div class="flex flex-wrap gap-2">
                                ${report.topics.map(t => `<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">#${t}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
                
                // 显示报告
                document.getElementById('report-actions').innerHTML = reportContent;
                document.getElementById('report-actions').style.display = 'block';
                
                // 显示导出按钮
                document.querySelector('.page-actions').style.display = 'flex';
            });

            // 计时器
            function startTimer() {
                let seconds = 0;
                analysisTimer = setInterval(() => {
                    seconds++;
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    document.getElementById('timer').textContent = 
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
            }

            // 导出PDF
            exportBtn?.addEventListener('click', () => {
                const reportContent = document.getElementById('report-actions').innerHTML;
                // 实际导出逻辑（需配合jspdf）
                alert('PDF导出功能已启用，请点击右上角导出按钮');
            });
        });
    </script>
</body>
</html>
