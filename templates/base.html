<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}民航短视频舆情分析{% endblock %}</title>
    <!-- Tailwind CSS 通过 CDN 引入（最简单的方式） -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 可选的额外样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- 导航栏（所有页面共有） -->
    <nav class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo区域 -->
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-lg">🛫</span>
                    </div>
                    <a href="{{ url_for('index') }}" class="text-xl font-bold text-gray-800 hover:text-blue-600 transition">
                        民航·舆监
                    </a>
                </div>
                
                <!-- 右侧导航链接 -->
                <div class="flex items-center space-x-4">
                    <a href="{{ url_for('index') }}" class="text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition">首页</a>
                    <span class="text-gray-300">|</span>
                    <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
                        LLM已配置
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域（子页面填充） -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- 底部信息 -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-400">
            © 2026 民航短视频舆情分析系统 · 基于多智能体协作 · 用 ❤️ 为大创项目打造
        </div>
    </footer>

    <!-- 自定义JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
EOF
